<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Game tính nhẩm (By TDH HK65)</title>
  <style>
    :root{
      --page-bg:#d0ebff;
      --card:#ffffff;
      --accent:#0f62fe;
      --muted:#475569;
      --good:#16a34a;
      --bad:#dc2626;
      --answer:#f97316;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial;background:var(--page-bg);color:#07203b;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .app{width:980px;max-width:95%;padding:18px}
    .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 10px 30px rgba(3,7,18,0.08)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    h1{margin:0;font-size:18px}
    .controls{display:flex;gap:8px;align-items:center}
    .btn{border:0;padding:8px 12px;border-radius:8px;cursor:pointer;background:#eef6ff;color:var(--accent)}
    .btn.primary{background:var(--accent);color:white;box-shadow:0 6px 18px rgba(15,98,254,0.12)}
    .grid{display:grid;grid-template-columns:1fr 320px;gap:14px}
    .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .meta div{font-size:14px}
    .question{font-size:34px;font-weight:700;text-align:center;padding:20px;border-radius:10px;background:linear-gradient(180deg,#fff,#f7fdff)}
    form{display:flex;gap:8px;align-items:center;margin-top:12px}
    input[type="number"], select{padding:10px;border-radius:10px;border:1px solid #e6edf3;font-size:16px;width:100%}
    .small{font-size:13px;padding:6px 8px;border-radius:8px}
    .ops button{margin-right:8px;margin-bottom:8px}
    .badge{display:inline-block;padding:6px 8px;border-radius:8px;background:#f1f5f9;color:var(--muted);font-size:13px}
    .score-inline{display:inline-flex;align-items:center;gap:6px}
    #scoreBurst{display:inline-block;font-weight:700;margin-left:6px;visibility:hidden;transform:scale(0.8);transition:transform 0.1s ease, opacity 0.12s ease;opacity:0}
    #correctReveal{display:block;margin-top:8px;font-weight:600;color:var(--answer);visibility:hidden;opacity:0;transition:opacity 0.08s linear}
    .modal-backdrop{position:fixed;inset:0;background:rgba(3,7,18,0.5);display:flex;align-items:center;justify-content:center;z-index:60}
    .modal{background:white;padding:20px;border-radius:12px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(2,6,23,0.3)}
    @media (max-width:880px){.grid{grid-template-columns:1fr}.question{font-size:26px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <header>
        <h1>🎯 Solo tính nhẩm (By TDH HK65)</h1>
        <div class="controls">
          <button id="startBtn" class="btn primary">Bắt đầu</button>
          <button id="stopBtn" class="btn" disabled>Dừng</button>
        </div>
      </header>

      <div class="grid">
        <main class="card" style="padding:14px">
          <div class="meta">
            <div>Điểm: <strong id="score">0</strong>
              <span class="score-inline">
                <span id="scoreBurst">+0</span>
              </span>
            </div>
            <div>Chuỗi đúng: <strong id="streak">0</strong></div>
            <div>Thời gian còn: <strong id="timeLeft">0</strong>s</div>
          </div>

          <div id="questionArea" class="question">Nhấn "Bắt đầu" để chơi</div>

          <form id="answerForm">
            <input id="answerInput" type="number" inputmode="numeric" placeholder="Nhập đáp án" autocomplete="off" disabled />
            <button id="submitBtn" class="btn small" disabled>Kiểm tra</button>
            <button id="skipBtn" class="btn small" type="button" disabled>Bỏ qua</button>
          </form>

          <div id="correctReveal">Đáp án đúng: <span id="correctText"></span></div>

          <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
            <div id="message" style="color:var(--muted)"></div>
            <div class="badge"></div>
          </div>
        </main>

        <aside>
          <div class="card settings" style="padding:12px;margin-bottom:12px">
            <label>Mức thời gian</label>
            <select id="timeSelect">
              <option value="10">10 giây</option>
              <option value="15">15 giây</option>
              <option value="18">18 giây</option>
              <option value="30">30 giây</option>
              <option value="45">45 giây</option>
              <option value="90">90 giây</option>
            </select>

            <label style="margin-top:10px">Chọn độ khó</label>
            <div style="display:flex;gap:8px;margin-bottom:10px">
              <label><input type="radio" name="diff" value="1" checked /> 1 chữ số</label>
              <label><input type="radio" name="diff" value="2" /> 2 chữ số</label>
              <label><input type="radio" name="diff" value="3" /> 3 chữ số</label>
            </div>

            <label>Số phép toán</label>
            <div class="ops" style="margin-bottom:10px">
              <button class="btn small op" data-op="add">+</button>
              <button class="btn small op" data-op="sub">−</button>
              <button class="btn small op" data-op="mul">×</button>
              <button class="btn small op" data-op="div">÷</button>
            </div>

            <div style="display:flex;gap:8px;justify-content:space-between">
              <button id="saveConfig" class="btn">Lưu setting</button>
              <button id="resetLb" class="btn">Xóa bảng xếp hạng</button>
            </div>
          </div>

          <div class="card" style="padding:12px">
            <h3 style="margin:0 0 8px 0">Bảng xếp hạng </h3>
            <ul id="leaderList" style="list-style:none;padding:0;margin:0"></ul>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div id="modalRoot" style="display:none"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timeSelect = document.getElementById('timeSelect');
    const answerInput = document.getElementById('answerInput');
    const answerForm = document.getElementById('answerForm');
    const submitBtn = document.getElementById('submitBtn');
    const skipBtn = document.getElementById('skipBtn');
    const questionArea = document.getElementById('questionArea');
    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const timeLeftEl = document.getElementById('timeLeft');
    const messageEl = document.getElementById('message');
    const opButtons = document.querySelectorAll('.op');
    const diffRadios = document.getElementsByName('diff');
    const saveConfig = document.getElementById('saveConfig');
    const resetLb = document.getElementById('resetLb');
    const leaderList = document.getElementById('leaderList');
    const modalRoot = document.getElementById('modalRoot');
    const scoreBurst = document.getElementById('scoreBurst');
    const correctReveal = document.getElementById('correctReveal');
    const correctText = document.getElementById('correctText');

    let playing = false, timeLimit = parseInt(timeSelect.value, 10), timeLeft = timeLimit, timer = null;
    let totalScore = 0, streak = 0, currentQ = null;
    let ops = { add:true, sub:true, mul:false, div:false };
    let diffLevel = 1;
    const LB_KEY = 'mental_math_lb_v4';

    function getLB(){ try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch { return []; } }
    function saveLB(arr){ localStorage.setItem(LB_KEY, JSON.stringify(arr.slice(0,10))); renderLB(); }

    function renderLB(){
      const lb = getLB();
      leaderList.innerHTML = '';
      if(lb.length === 0){ leaderList.innerHTML = '<li style="color:var(--muted)">Chưa có người chơi</li>'; return; }
      lb.forEach((e,i)=>{
        const li = document.createElement('li');
        li.textContent = `${i+1}. ${e.name} — ${e.score} điểm`;
        li.style.padding = '6px'; li.style.borderRadius = '8px'; li.style.marginBottom = '8px'; li.style.background = '#f8fbff';
        const colors = ['#00bfff','#ffd700','#c0c0c0','#cd7f32','#555555'];
        if(i < 5) li.style.color = colors[i];
        leaderList.appendChild(li);
      });
    }
    renderLB();

    function randInt(min,max){ return Math.floor(Math.random()*(max-min+1)) + min; }
    function getSelectedDiff(){ for(const r of diffRadios) if(r.checked) return parseInt(r.value,10); return 1; }
    function pickOp(){ const enabled = Object.keys(ops).filter(k=>ops[k]); return enabled[randInt(0, enabled.length-1)]||'add'; }
    function rangeFor(d){ return d===1?{min:1,max:9}:d===2?{min:10,max:99}:{min:100,max:999}; }
    function countSelectedOps(){ return Object.values(ops).filter(Boolean).length||1; }

    function genQuestion(){
      const r = rangeFor(diffLevel); const op = pickOp(); let a,b,correct;
      if(op==='add'){a=randInt(r.min,r.max);b=randInt(r.min,r.max);correct=a+b;}
      else if(op==='sub'){a=randInt(r.min,r.max);b=randInt(r.min,Math.min(a,r.max));correct=a-b;}
      else if(op==='mul'){a=randInt(r.min,Math.max(r.min,Math.floor(r.max/4)));b=randInt(1,9);correct=a*b;}
      else if(op==='div'){b=randInt(1,9);const q=randInt(Math.max(1,Math.floor(r.min/b)),Math.max(1,Math.floor(r.max/b)));a=q*b;correct=q;}
      else {a=randInt(r.min,r.max);b=randInt(r.min,r.max);correct=a+b;}
      return {a,b,op,correct};
    }
    function formatQ(q){const sym=q.op==='add'?'+':q.op==='sub'?'−':q.op==='mul'?'×':'÷';return `${q.a} ${sym} ${q.b} = ?`;}
    function pointsPerCorrect(){const pts=Math.round(90/timeLimit*diffLevel*countSelectedOps());return Math.max(1,pts);}

    function showScoreBurst(value,positive){
      scoreBurst.textContent=value;scoreBurst.style.visibility='visible';scoreBurst.style.opacity='1';
      scoreBurst.style.transform='scale(1.5)';scoreBurst.style.color=positive?'var(--good)':'var(--bad)';
      setTimeout(()=>{scoreBurst.style.transform='scale(0.95)';scoreBurst.style.opacity='0';
      setTimeout(()=>{scoreBurst.style.visibility='hidden';},120);},100);
    }
    function showCorrectReveal(c){correctText.textContent=c;correctReveal.style.visibility='visible';correctReveal.style.opacity='1';
      setTimeout(()=>{correctReveal.style.opacity='0';setTimeout(()=>{correctReveal.style.visibility='hidden';correctText.textContent='';},120);},200);}

    function startGame(){
      if(playing)return;
      timeLimit=parseInt(timeSelect.value,10)||30;diffLevel=getSelectedDiff();timeLeft=timeLimit;totalScore=0;streak=0;
      scoreEl.textContent=totalScore;streakEl.textContent=streak;timeLeftEl.textContent=timeLeft;messageEl.textContent='';
      answerInput.disabled=false;submitBtn.disabled=false;skipBtn.disabled=false;startBtn.disabled=true;stopBtn.disabled=false;
      currentQ=genQuestion();questionArea.textContent=formatQ(currentQ);answerInput.value='';answerInput.focus();
      playing=true;timer=setInterval(()=>{timeLeft--;timeLeftEl.textContent=timeLeft;if(timeLeft<=0)finishGame();},1000);
    }

    function stopGame(){if(!playing)return;clearInterval(timer);playing=false;answerInput.disabled=submitBtn.disabled=skipBtn.disabled=true;
      startBtn.disabled=false;stopBtn.disabled=true;messageEl.textContent='Đã dừng';}

    function finishGame(){clearInterval(timer);playing=false;answerInput.disabled=submitBtn.disabled=skipBtn.disabled=true;
      startBtn.disabled=false;stopBtn.disabled=true;showModal(totalScore);}

    function showModal(finalScore){
      modalRoot.innerHTML='';modalRoot.style.display='flex';modalRoot.className='modal-backdrop';
      const md=document.createElement('div');md.className='modal';
      md.innerHTML=`<h2>⏰ Hết giờ!</h2><p style="font-size:20px;margin:10px 0">Điểm của bạn: <strong>${finalScore}</strong></p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
      <button id="playAgain" class="btn primary">Chơi lại</button><button id="saveScore" class="btn">Lưu điểm</button></div>
      <p style="margin-top:10px;color:var(--muted);font-size:13px">Lưu điểm vào bảng xếp hạng nếu muốn.</p>`;
      modalRoot.appendChild(md);
      document.getElementById('playAgain').onclick=()=>{modalRoot.style.display='none';startGame();};
      document.getElementById('saveScore').onclick=()=>{
        const name=prompt('Nhập tên để lưu điểm (bỏ trống để hủy):');
        if(name&&name.trim()){
          let lb=getLB();
          const idx=lb.findIndex(e=>e.name===name.trim());
          if(idx>=0)lb[idx].score=finalScore;else lb.push({name:name.trim(),score:finalScore});
          lb.sort((a,b)=>b.score-a.score);
          const oldTop=lb.slice(0,5).map(e=>e.name);
          saveLB(lb);
          const newTop=getLB().slice(0,5).map(e=>e.name);
          if(newTop.includes(name.trim()))confetti({particleCount:120,spread:80,origin:{y:0.7}});
          alert('Đã lưu vào bảng xếp hạng!');
          modalRoot.style.display='none';
        }
      };
    }

    answerForm.addEventListener('submit',e=>{
      e.preventDefault();
      if(!playing||!currentQ)return;
      const inputVal=answerInput.value.trim();
      if(inputVal===''){messageEl.textContent='Vui lòng nhập đáp án!';return;}
      const val=Number(inputVal);
      if(Number.isNaN(val)){messageEl.textContent='Vui lòng nhập số hợp lệ';return;}
      if(val===currentQ.correct){
        streak++;
        const pts=pointsPerCorrect()* (streak>1?streak:1);
        totalScore+=pts;
        scoreEl.textContent=totalScore;streakEl.textContent=streak;
        messageEl.textContent=`Đúng! +${pts} điểm`;showScoreBurst('+'+pts,true);
      }else{
        messageEl.textContent='Sai rồi';showScoreBurst('+0',false);
        streak=0;streakEl.textContent=streak;showCorrectReveal(currentQ.correct);
      }
      currentQ=genQuestion();questionArea.textContent=formatQ(currentQ);answerInput.value='';answerInput.focus();
    });

    skipBtn.onclick=()=>{if(!playing)return;messageEl.textContent='Bỏ qua';streak=0;streakEl.textContent=streak;
      currentQ=genQuestion();questionArea.textContent=formatQ(currentQ);answerInput.value='';answerInput.focus();};

    startBtn.onclick=startGame;stopBtn.onclick=stopGame;
    resetLb.onclick=()=>{if(confirm('Bạn có chắc muốn xóa toàn bộ bảng xếp hạng?')){localStorage.removeItem(LB_KEY);renderLB();}};

    opButtons.forEach(btn=>{btn.onclick=e=>{
      e.preventDefault();const k=btn.dataset.op;ops[k]=!ops[k];btn.classList.toggle('primary',ops[k]);
    };});

    saveConfig.onclick=e=>{e.preventDefault();alert('Đã lưu setting tạm thời');};
  </script>
</body>
</html>
